name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: |
          pod install

      - name: Build unsigned app (CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild -workspace GMDM.xcworkspace \
            -scheme GMDM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/GMDM.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 兜底：如果 XcodeGen 的 folder reference 没有把 www 拷进 .app，手动补上
          if [ ! -d "Payload/GMDM.app/www" ]; then
            echo "www not in app bundle, copying manually"
            cp -R www "Payload/GMDM.app/www"
          fi
          echo "--- www contents ---"
          ls -la Payload/GMDM.app/www
          zip -ry GMDM-unsigned.ipa Payload
          echo "IPA size: $(du -sh GMDM-unsigned.ipa)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMDM-unsigned-ipa
          path: GMDM-unsigned.ipa
